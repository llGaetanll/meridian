[package]
name = "api-core"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib for the phone apps to link against, lib so the Rust front-ends can
# depend on it directly.
crate-type = ["cdylib", "lib"]
name = "api_core"

[dependencies]
# The value types the machine decides over, and the wire shapes it is handed.
# Both are platform-agnostic and neither does IO, so the machine stays
# synchronous and testable with them in scope.
api-common = { path = "../api-common" }
api-ledger = { path = "../api-ledger" }
api-wire = { path = "../api-wire" }

serde_json = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }

[[bin]]
# The bindings generator, so `cargo run -p api-core --bin uniffi-bindgen`
# needs no separately installed tool at a matching version.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
