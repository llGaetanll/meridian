[package]
name = "phone-main"
version = "0.1.0"
edition = "2024"

[dependencies]
# The decisions. Everything this crate does is render what the core hands it.
api-common = { path = "../api-common" }
phone-state = { path = "../phone-state" }
api-trace = { path = "../api-trace" }

leptos = { workspace = true }
tracing = { workspace = true }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Window",
]
