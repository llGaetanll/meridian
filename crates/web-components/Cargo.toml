[package]
name = "web-components"
version = "0.1.0"
edition = "2024"

[dependencies]
api-common = { path = "../api-common" }
api-ledger = { path = "../api-ledger" }
client-state = { path = "../client-state" }
leptos = { workspace = true }
tracing = { workspace = true }
web-ui = { path = "../web-ui" }

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlDivElement",
    "HtmlElement",
    "NodeList",
    "PointerEvent",
    "ResizeObserver",
    "ScrollBehavior",
    "Storage",
    "ScrollToOptions",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Window",
]
