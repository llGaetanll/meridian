<!DOCTYPE html>
<!--
  Where Stripe sends the Checkout window when somebody backs out without
  paying, on the web.

  The address is the message, as on paid.html: this page is the one that
  means nothing was taken. Nothing was charged and nothing was created, so
  all it does is go.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meridian</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        /* theme.css's --bg and --text-muted: nothing here is built, so the
           page cannot read them. */
        background: #01030a;
        color: #94a3b8;
        font: 14px/1.5 Inter, ui-sans-serif, -apple-system, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Nothing was charged. You can close this window.</p>
    <script>window.close();</script>
  </body>
</html>
