<!DOCTYPE html>
<!--
  Where Stripe sends the Checkout window when somebody backs out without
  paying, on the web.

  The address is the message, as on paid.html: this page is the one that
  means nothing was taken. It waits to be read and closed for the reason
  that page does — closing itself straight away races the app's look, and a
  window gone unread reads as closed by hand. Here the two happen to mean
  the same thing, but only one of the two pages behaving is a trap.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meridian</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        /* theme.css's --bg and --text-muted: nothing here is built, so the
           page cannot read them. */
        background: #01030a;
        color: #94a3b8;
        font: 14px/1.5 Inter, ui-sans-serif, -apple-system, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Nothing was charged. Taking you back&hellip;</p>
    <script>setTimeout(() => window.close(), 2000);</script>
  </body>
</html>
