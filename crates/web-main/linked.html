<!DOCTYPE html>
<!--
  Where Plaid sends the bank's window when a Link session ends, on the web.

  It carries nothing: what the session came to is `/link/finish`'s to say, and
  the app asks as soon as this window is gone. So all it does is go. The app
  closes it too, when it sees the window back on its own origin — this is for
  the moment before it looks.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meridian</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        /* theme.css's --bg and --text-muted: nothing here is built, so the
           page cannot read them. */
        background: #01030a;
        color: #94a3b8;
        font: 14px/1.5 Inter, ui-sans-serif, -apple-system, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>You can close this window.</p>
    <script>window.close();</script>
  </body>
</html>
