[watch]
watch = [
    "../web-main/src",
    "../web-main/css",
    "../web-main/input.css",
    "../../sketches/shared",
    "../web-ui/src",
    "../web-components/src",
    "../client-state/src",
    "../api-common/src",
    "../api-ledger/src",
    "../api-trace/src",
    "../server-wire/src",
]

[build]
target = "index.html"

# trunk's own default is 8080, which this machine allocates to nothing. 7130 is
# the web app's number in docs/PORTS.md and the one WEB_ORIGINS names, so a
# trunk run on the host is the same address as the container's published port.
# The container overrides this with --port 3000 and is published on 7130, since
# inside a container a web app belongs on 3000.
[serve]
port = 7130

[[assets]]
file = "input.css"

# input.css is written for Tailwind 4. With no `tailwindcss` on PATH, trunk
# downloads the version named here; left unset it fetches 3.3.5, which drops
# every @import and ships a stylesheet with nothing in it.
[tools]
tailwindcss = "4.3.3"

# Browsers cannot call Yahoo directly (no CORS headers), so in development the
# dev server forwards /v8 and /v1 to it. Native builds talk to Yahoo directly.
[[proxy]]
backend = "https://query1.finance.yahoo.com/v8"

[[proxy]]
backend = "https://query1.finance.yahoo.com/v1"
