<!DOCTYPE html>
<!--
  Where Stripe sends the Checkout window when the money is taken, on the web.

  The address is the message: the app looks at the window twice a second,
  reads which page it came home to, and closes it — this page is the one that
  means paid. It must not close itself straight away: a window gone before
  the app has read where it was is indistinguishable from one closed by
  hand, which is the other outcome. The delayed close is for a window whose
  opener is no longer watching.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meridian</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        /* theme.css's --bg and --text-muted: nothing here is built, so the
           page cannot read them. */
        background: #01030a;
        color: #94a3b8;
        font: 14px/1.5 Inter, ui-sans-serif, -apple-system, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Payment received. Taking you back&hellip;</p>
    <script>setTimeout(() => window.close(), 2000);</script>
  </body>
</html>
