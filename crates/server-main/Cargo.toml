[package]
name = "server-main"
version = "0.1.0"
edition = "2024"

[dependencies]
api-common = { path = "../api-common" }
api-ledger = { path = "../api-ledger" }
api-trace = { path = "../api-trace" }
server-wire = { path = "../server-wire" }
src-plaid = { path = "../src-plaid" }
src-resend = { path = "../src-resend" }
src-postgres = { path = "../src-postgres" }

anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"] }
dotenvy = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "net", "time"] }
tower-http = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
uuid = { workspace = true }
api-common = { path = "../api-common" }
api-ledger = { path = "../api-ledger" }
api-eval = { path = "../api-eval" }

[lib]
name = "server_main"
path = "src/lib.rs"

[[bin]]
name = "server-main"
path = "src/main.rs"
