# What the dev stack becomes on the box. Merged over docker-compose.yml, never
# used on its own:
#
#     COMPOSE_PROFILES=server docker compose \
#         -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# `scripts/deploy.sh` is what actually types that, so nobody has to.
#
# Almost everything here only *adds*. Compose merges the two files rather than
# letting one replace the other, so anything that has to *differ* between a
# laptop and the box is a variable in docker-compose.yml instead —
# `SERVER_BIND` is the only one, and it is there rather than here for exactly
# that reason.
#
# The one exception is `image:` on the server, which supersedes the `build:`
# that docker-compose.yml carries. The box does not compile: see below.

services:
  db:
    # The box reboots for a kernel update and nothing is watching. Without this
    # the stack comes back only when somebody notices it is gone.
    restart: unless-stopped

    # The prod number, replacing the dev file's rather than being appended to
    # it: a merge appends ports, and `!override` is how a list is replaced.
    # The last digit is the environment, so what a shell on the box reaches is
    # never the number a laptop uses. docs/PORTS.md has the scheme.
    ports: !override
      - "127.0.0.1:7111:5432"

    # The second exception to "this file only adds". On a laptop Postgres
    # writes to the meridian-db named volume; on the box that would be the
    # droplet's own disk, which DigitalOcean does not encrypt at rest. This
    # bind mount supersedes it — compose merges volume mounts by container
    # path — and points at the meridian-db block-storage Volume mounted at
    # /mnt/meridian-db, which DigitalOcean encrypts with a key it holds (#33).
    volumes:
      - /mnt/meridian-db/data:/var/lib/postgresql/data

    # Docker's default is an unbounded log file, which fills a disk in weeks and
    # takes Postgres down with it — a failure that reads as a database problem
    # and is not one.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  server:
    # Loopback, always, and stated here rather than left to SERVER_BIND: the
    # box cannot get this wrong by forgetting a variable. Caddy reaches the
    # server by service name; what this is for is asking it something directly
    # from a shell on the box (#145).
    ports: !override
      - "127.0.0.1:7121:7120"

    # Built on a laptop and shipped as an image, so this names a tag rather than
    # a build. `build:` from docker-compose.yml is still merged in here and is
    # deliberately never reached: compose builds only when the tag is missing,
    # and `scripts/deploy.sh ship` has loaded it before it runs `up`.
    #
    # Pinned to the commit rather than `latest` so that what is running is
    # named, and so the previous image is still on the box under its own tag —
    # which is the whole of a rollback now that there is no source here to
    # rebuild from.
    #
    # There is no source tree on the box, so a `--build` typed here fails
    # rather than quietly recompiling 427 crates on a 2 GB machine. That is the
    # right answer: the failure is the message.
    image: meridian-server:${MERIDIAN_SHA:?}

    restart: unless-stopped
    logging: *logging

  # The web app and the site, each a Caddy handing out files that were built on
  # the laptop — `deploy/web` and `deploy/site`. Shipped with the server under
  # the same tag, so one commit is one deploy of every image and a rollback names
  # them all.
  #
  # No ports of their own — Caddy below reaches each by service name, and
  # there is nothing in either worth asking for from a shell on the box. The
  # dev file's publish on `web` would otherwise merge in, since a merge appends
  # ports rather than removing them; `!override` with an empty list is what
  # actually takes it away, and it is a better answer than the box remembering
  # to set WEB_BIND (#145).
  web:
    profiles: ["server"]
    image: meridian-web:${MERIDIAN_SHA:?}
    restart: unless-stopped
    logging: *logging
    ports: !override []

  site:
    profiles: ["server"]
    image: meridian-site:${MERIDIAN_SHA:?}
    restart: unless-stopped
    logging: *logging

  # The bookkeeper: once a day it pulls the month's numbers from Stripe and
  # the database and rewrites the Google Sheet. docs/BOOKS.md is the whole of
  # it, including the two secrets below that reach a box by hand — the
  # service-account key beside the certificates, and BOOKS_* in `.env`.
  books:
    profiles: ["server"]
    image: meridian-books:${MERIDIAN_SHA:?}
    restart: unless-stopped
    logging: *logging

    depends_on:
      db:
        condition: service_healthy

    environment:
      # The same URL the server gets, for two SELECTs of created_at columns.
      # No MERIDIAN_DB_KEY: nothing here reads a sealed column.
      DATABASE_URL: postgres://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD:-meridian}@db:5432/${POSTGRES_DB:-meridian}?sslmode=verify-full&sslrootcert=/certs/ca.crt

      # A restricted key that can read balance transactions and nothing else,
      # never the server's secret key. Empty is allowed: the pass logs it and
      # writes the fixed costs alone.
      BOOKS_STRIPE_KEY: ${BOOKS_STRIPE_KEY:-}

      BOOKS_GOOGLE_KEY: /certs/books-google-key.json

    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/books-google-key.json:/certs/books-google-key.json:ro

  caddy:
    # Behind the same profile as the server, so a bare `up` on the box still
    # gets the database alone and the two halves cannot disagree about whether
    # the server is part of the stack.
    profiles: ["server"]

    # Pinned to a major, like Postgres. Caddy does upgrade cleanly across
    # minors, so this is the version that gets patches without a surprise.
    image: caddy:2-alpine

    restart: unless-stopped
    logging: *logging

    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless where it is unsupported — a client that cannot speak
      # it never learns the port is open.
      - "443:443/udp"

    volumes:
      # The box's own, written by hand at `/srv/meridian/Caddyfile` and not
      # shipped by `deploy.sh`: the machine serves other projects and the file
      # names them. `deploy/box/Caddyfile` is Meridian's share of it.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # The certificate and the account key. This is the volume that matters:
      # without it every restart is a fresh Let's Encrypt account asking for a
      # fresh certificate, and their rate limit — five per name per week —
      # turns a few restarts into a box that cannot serve https until it
      # expires.
      - caddy-data:/data
      - caddy-config:/config

    environment:
      # No defaults for these two. A box that has not said which name it
      # answers to would get a certificate for nothing, and one that has not
      # named an address would never hear that renewal is failing.
      MERIDIAN_DOMAIN: ${MERIDIAN_DOMAIN:?}
      TLS_EMAIL: ${TLS_EMAIL:?}

      # The web app's name and the site's. No defaults either, for the same
      # reason, and one more: a box that has not been given them is a box whose
      # DNS was never pointed at them, and asking Let's Encrypt for a name that
      # does not resolve here is a failed challenge counted against the name.
      MERIDIAN_APP_DOMAIN: ${MERIDIAN_APP_DOMAIN:?}
      MERIDIAN_SITE_DOMAIN: ${MERIDIAN_SITE_DOMAIN:?}

      # The Apple Developer team the phone app is signed by, which the
      # Caddyfile puts in the file iOS reads to decide whether this domain
      # vouches for that app. Unset is allowed and is what a box without an
      # app-store account has: the file then names a team that owns nothing,
      # no app claims the link, and nothing is sent there anyway because
      # PLAID_REDIRECT_URI is unset alongside it.
      #
      # The default is spelled here rather than in the Caddyfile: a placeholder
      # default fires only when a variable is unset, and compose defines this
      # one either way. Empty, it would serve an appID of `.com.meridian.phone`
      # — a 200 that looks right and vouches for nothing.
      MERIDIAN_TEAM_ID: ${MERIDIAN_TEAM_ID:-TEAMID}

    depends_on:
      - server
      - web
      - site

volumes:
  caddy-data:
  caddy-config:

# The network, named here only so that it can be given an IPv6 subnet.
#
# Without this the network is v4-only, and a v6 caller to a published port is
# terminated on the host by `docker-proxy`, which opens a *fresh v4 connection*
# to the container. The caller's address is gone before Caddy sees it, so
# `X-Forwarded-For` carries the bridge gateway and every v6 client reads as one
# machine — see #35, where it was measured rather than guessed at. US mobile
# carriers are largely v6, so that is the phone on cellular: the caller we most
# want to tell apart, in the one bucket we cannot.
#
# With a v6 subnet the daemon DNATs instead of proxying and the source survives.
# It needs `ip6tables` on in the daemon, which is the default from Docker 27 and
# is why there is no `daemon.json` here.
#
# Only in this file. A laptop has no reason to route v6 to a container, and
# Docker Desktop's networking is not the daemon's.
#
# A ULA prefix (`fd00::/8`), which is v6's private range: these addresses are
# not routable on the internet and are not meant to be. Nothing dials the
# containers directly — the published port is still the only door.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd4d:6572:6964::/64
