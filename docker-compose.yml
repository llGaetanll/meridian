# The whole operation, in one command.
#
#   docker compose up -d                      the database, for a server run on
#                                             the host with `cargo run`
#   docker compose --profile server up        both, exactly as deployed
#
# The split is a development convenience and nothing more. `cargo run` rebuilds
# in about three seconds where an image rebuild is closer to twenty, so the
# database alone is what you want while writing code — but the server container
# is the real target and is meant to stay working, not to rot.

services:
  db:
    # Pinned to a major version on purpose. Postgres does not upgrade its data
    # directory across majors: moving 17 to 18 by editing this line gives a
    # container that refuses to start against the existing volume. That is a
    # dump and a restore, deliberately, not a tag change.
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}

    ports:
      # Loopback only. The phone needs to reach the *server*; nothing outside
      # this machine has any business reaching the database, and `5432:5432`
      # would put it on the network for anyone to try.
      - "127.0.0.1:5432:5432"

    volumes:
      - meridian-db:/var/lib/postgresql/data

      # Made by scripts/db-certs.sh, per machine, and never committed. Read
      # only: what the container needs from them it copies out below.
      - ./certs:/certs:ro

    # Postgres will not start with a key it considers readable by anyone else,
    # and a bind mount arrives with whatever ownership the host gave it —
    # `staff` on a Mac, `meridian` on the box, neither of them `postgres`.
    # Copying to a private directory owned by `postgres` is what makes the same
    # compose file work in both places, and it is why this runs before the real
    # entrypoint rather than being solved with `chown` on the host.
    #
    # `$$@` is the `command:` below: compose appends it, `sh -c` takes it after
    # the `--`, and `docker-entrypoint.sh` gets it unchanged.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        install -d -o postgres -g postgres -m 700 /etc/postgresql/certs
        install -o postgres -g postgres -m 600 /certs/server.key /etc/postgresql/certs/server.key
        install -o postgres -g postgres -m 644 /certs/server.crt /etc/postgresql/certs/server.crt
        exec docker-entrypoint.sh "$$@"
      - --

    # `ssl=on` offers TLS; it does not require it. What requires it is the
    # client saying `sslmode=verify-full`, which the server does below. Host
    # tooling — psql, scripts/db-shell.sh — keeps connecting as it did.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key

    # What makes `depends_on` below mean anything. Without it the server starts
    # the moment the container exists rather than when Postgres is listening,
    # races it, and fails on a cold `up` — which is exactly the confidence this
    # file is supposed to buy.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  server:
    # Not started by a plain `up`. See the header.
    profiles: ["server"]

    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamped into every log line. `scripts/dev.sh` works it out and
        # exports it, so anything driven through that has the real commit; a
        # deploy, or a `docker compose` typed by hand, must pass its own:
        #
        #     MERIDIAN_SHA=$(git rev-parse --short HEAD) docker compose build server
        #
        # The default is what a build with no commit to give says on every
        # line, and it is the answer this stamp exists to avoid.
        MERIDIAN_SHA: ${MERIDIAN_SHA:-unknown}

    depends_on:
      db:
        condition: service_healthy

    environment:
      # `db` rather than localhost: inside the network the database is a
      # service name. This is the one setting that has to differ between a
      # server in a container and one on the host.
      #
      # `sslmode=verify-full` is stated rather than left to sqlx, whose default
      # is `prefer` — try TLS, fall back to plain text, say nothing either way.
      # That default is how this connection was in the clear without anything
      # in the repo admitting it, and it is worse than it sounds: the day
      # Postgres offers TLS, `prefer` takes it without checking the
      # certificate, which looks secure and is not.
      #
      # `verify-full` and not `require`: `require` encrypts and accepts any
      # certificate at all, so it stops a passive listener and not the one that
      # answers. `verify-full` also checks the name, which is why the
      # certificate carries `db` — see scripts/db-certs.sh.
      DATABASE_URL: postgres://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD:-meridian}@db:5432/${POSTGRES_DB:-meridian}?sslmode=verify-full&sslrootcert=/certs/ca.crt

      # Required wherever DATABASE_URL is: it opens the access token column,
      # and a server that cannot read its own credentials has nothing to serve.
      MERIDIAN_DB_KEY: ${MERIDIAN_DB_KEY:?}

      # Passed through rather than read from an `env_file`, so they are never
      # baked into the image, where they would survive in `docker history` for
      # anyone who pulled it.
      #
      # No compose-level defaults: the server requires every one of these and
      # exits naming what is missing, and a `:-sandbox` here would answer that
      # question on behalf of whoever forgot to.
      EMAIL_SEND: ${EMAIL_SEND:?}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}

      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?}
      PLAID_SECRET: ${PLAID_SECRET:?}
      PLAID_ENV: ${PLAID_ENV:?}
      PLAID_COLLECT: ${PLAID_COLLECT:?}

      # Required by the server only when PLAID_COLLECT=webhook, so it is empty
      # here rather than `:?` — a laptop that polls has no public address and
      # should not be made to invent one.
      PUBLIC_URL: ${PUBLIC_URL:-}

      # Where an OAuth bank's own app hands the sign-in back. The one variable
      # the server treats as optional on purpose: unset, the link token is the
      # one a browser gets and an OAuth bank stays inside the web session, so
      # empty here rather than `:?`.
      #
      # It has to be listed even so. The server reads it from its own
      # environment, and a variable that lives only in `.env` is one the
      # container never sees — the startup line's `handback=` then says `none`
      # however the file is set.
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI:-}

      # Required, like the rest. Which origins a browser may call this server
      # from, and the only setting here that no other kind of client notices.
      WEB_ORIGINS: ${WEB_ORIGINS:?}

      # Stripe, which is how a subscription is paid for. Empty rather than `:?`
      # because the server treats all three as optional: without them it starts
      # and says at WARN that nobody can subscribe, which is what a laptop that
      # is not selling anything should do.
      #
      # Without the webhook secret every webhook is refused, which is the safe
      # direction — an unverified webhook is somebody claiming a subscription
      # was paid for.
      #
      # STRIPE_PUBLISHABLE_KEY is deliberately absent. It belongs to the card
      # form in the browser, and no service here serves one.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # The server's stdout here is a pipe to the daemon, never a terminal, so
      # left to work it out for itself it turns colour off — and the log is
      # then plain for `docker compose logs` too, which is a terminal and would
      # have rendered it. Overridden rather than fixed with `tty: true`: a pty
      # would also fold stderr into stdout and put a `\r` on every line, which
      # is a lot of new behaviour to buy one thing. `NO_COLOR` still wins, for
      # anyone who wants it off.
      CLICOLOR_FORCE: "1"

    volumes:
      # The CA the database's certificate is checked against, and nothing else
      # — no key, because verifying a signature needs none. Named by
      # `sslrootcert` in DATABASE_URL above.
      - ./certs/ca.crt:/certs/ca.crt:ro

    ports:
      # Every interface on a laptop, because a real phone on the LAN is one of
      # the clients and nothing answers on loopback from another device.
      #
      # On the box it is loopback, and that is the whole of the difference
      # between the two deployments: Caddy reaches the server by service name
      # over this network and needs no published port at all, so publishing one
      # anywhere but loopback would be a second door into the same building.
      # What it is still good for there is asking the server something directly
      # from a shell on the box, rather than through the proxy — see the
      # `health` subcommand in `scripts/deploy.sh` for the request that says
      # everything is up.
      - "${SERVER_BIND:-0.0.0.0}:8082:8082"

volumes:
  meridian-db:
