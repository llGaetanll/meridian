# The toolchain this workspace builds with, so every machine agrees.
#
# Pinned to a version rather than to `stable`, because `stable` is not one
# thing: it is whatever that machine last updated to, which is how a build that
# works here fails on a laptop nobody has touched in a month. `sqlx` 0.9 needs
# 1.94, and a laptop on 1.93 stopped before compiling anything — with an error
# about a dependency rather than about the toolchain, which is the part that
# cost an afternoon.
#
# rustup reads this and installs it on the first cargo command, so a clone
# needs no instructions.
#
# **Formatting is not this toolchain's job.** Two options in `rustfmt.toml` are
# nightly-only, so `.githooks/pre-commit` asks for `cargo +nightly fmt` by
# name and keeps working whatever this says. Moving the format to stable means
# dropping those two options, which is a separate decision.
#
# Raising this is deliberate: bump it, build, run the tests, commit the change
# on its own. Then every machine moves together on the next cargo command.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
